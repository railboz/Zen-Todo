<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="theme-init.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="theme-modern.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></div>
    <div class="titles">
      <h1>Zen Todo</h1>
      <div id="subtitle" class="sub"></div>
    </div>
    <div class="counter"><b id="left">0</b><span data-i18n="left"></span></div>
    <button id="sync-ind" class="icon-btn" type="button" hidden>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .42-8.98 6.5 6.5 0 0 0-12.7 1.61A4 4 0 0 0 6 19z"/></svg>
    </button>
    <button id="theme-toggle" class="icon-btn" data-i18n-title="themeTitle">
      <svg class="ico-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ico-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="settings" class="icon-btn" data-i18n-title="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <nav id="tabs" class="tabs" role="tablist">
    <button type="button" class="tab" role="tab" data-tab="tasks" aria-selected="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg><span data-i18n="tabTasks"></span></button>
    <button type="button" class="tab" role="tab" data-tab="projects" aria-selected="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-i18n="tabProjects"></span></button>
  </nav>

  <div id="main-view" class="view">
    <form id="add-form" class="card" autocomplete="off">
      <input id="new-text" type="text" maxlength="200" data-i18n-placeholder="newTask">
      <div class="opt-toggles">
        <button id="details-toggle" class="note-toggle" type="button" aria-expanded="false" aria-controls="add-row"><span aria-hidden="true">+</span><span data-i18n="detailsToggle"></span></button>
        <button id="note-toggle" class="note-toggle" type="button" aria-expanded="false" aria-controls="new-note"><span aria-hidden="true">+</span><span data-i18n="addNote"></span></button>
      </div>
      <textarea id="new-note" class="note-input" rows="2" maxlength="500" data-i18n-placeholder="notePlaceholder"></textarea>
      <div class="row" id="add-row">
        <select id="new-priority"></select>
        <button type="submit" class="add-btn" id="add-btn"><span class="plus">+</span><span data-i18n="add"></span></button>
      </div>
    </form>

    <div class="toolbar">
      <div id="search-box" class="search" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="search" type="text" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
        <button id="search-clear" type="button" class="search-x" data-i18n-title="clearSearch" hidden>×</button>
      </div>
      <select id="sort-select" class="sort-select" data-i18n-title="sortTitle"></select>
    </div>

    <div id="filters" class="filters" role="group" hidden></div>

    <ul id="list" class="list"></ul>

    <div id="empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12.5l3 3 5-6"/></svg>
      <strong data-i18n="emptyTitle"></strong>
      <span data-i18n="emptyText"></span>
    </div>

    <div id="no-results" class="empty" hidden>
      <strong data-i18n="noResults"></strong>
      <span data-i18n="noResultsText"></span>
    </div>

    <footer>
      <button id="clear" class="clear-btn">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        <span data-i18n="clearCompleted"></span>
      </button>
      <span class="hint"><span data-i18n="dragHint"></span> <b id="saved" class="saved" data-i18n="saved"></b></span>
    </footer>
  </div>

  <div id="projects-view" class="view" hidden>
    <form id="project-form" class="card" autocomplete="off">
      <div class="row">
        <input id="new-project" type="text" maxlength="80" data-i18n-placeholder="newProject">
        <button type="submit" class="add-btn" id="project-add-btn"><span class="plus">+</span><span data-i18n="createProject"></span></button>
      </div>
    </form>
    <ul id="project-list" class="list"></ul>
    <div id="projects-empty" class="empty" hidden>
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <strong data-i18n="projectsEmptyTitle"></strong>
      <span data-i18n="projectsEmptyText"></span>
    </div>
  </div>

  <div id="settings-view" class="view" hidden>
    <div class="set-top">
      <button id="back" class="back-btn" type="button"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg><span data-i18n="back"></span></button>
      <h2 class="set-title"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="settings"></span></h2>
    </div>

    <section class="card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></span><div><h2 data-i18n="optLanguage"></h2><p class="muted" data-i18n="optLanguageDesc"></p></div></div>
      <div class="row">
        <button type="button" class="lang" data-lang="fr">Français</button>
        <button type="button" class="lang" data-lang="en">English</button>
        <button type="button" class="lang" data-lang="es">Español</button>
        <button type="button" class="lang" data-lang="de">Deutsch</button>
      </div>
    </section>

    <section class="card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><div><h2 data-i18n="themeTitle"></h2><p class="muted" data-i18n="themeDesc"></p></div></div>
      <div class="row">
        <button type="button" class="lang theme" data-theme="dark" data-i18n="themeDark"></button>
        <button type="button" class="lang theme" data-theme="light" data-i18n="themeLight"></button>
      </div>
      <div class="sc-row-label" id="textsize-label"><span data-i18n="textSizeTitle"></span></div>
      <p class="muted" data-i18n="textSizeDesc"></p>
      <div class="row" id="textsize-chips" role="group" aria-labelledby="textsize-label">
        <button type="button" class="lang textsize" data-size="small" data-i18n="textSize_small"></button>
        <button type="button" class="lang textsize" data-size="normal" data-i18n="textSize_normal"></button>
        <button type="button" class="lang textsize" data-size="large" data-i18n="textSize_large"></button>
      </div>
    </section>

    <section class="card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V4"/><path d="M5 4h13l-2.5 4.5L18 13H5"/></svg></span><div><h2 data-i18n="optDefaultPriority"></h2><p class="muted" data-i18n="optDefaultPriorityDesc"></p></div></div>
      <div id="prio-chips" class="chips" role="radiogroup"></div>
    </section>

    <section class="card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></span><div><h2 data-i18n="sortTitle"></h2><p class="muted" data-i18n="sortDesc"></p></div></div>
      <select id="sort-select-settings" class="sort-select-full"></select>
    </section>

    <section class="card" id="shortcuts-card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg></span><div><h2 data-i18n="shortcutTitle"></h2><p class="muted" data-i18n="shortcutDesc"></p></div></div>
      <div class="sc-group">
        <div class="sc-row-label"><span data-i18n="shortcutPopup"></span></div>
        <div class="row sc-row">
          <button id="sc-btn" type="button" class="sc-btn"></button>
          <button id="sc-reset" type="button" class="dp-link" data-i18n="shortcutReset"></button>
        </div>
        <div id="sc-msg" class="msg" role="status"></div>
        <div class="sc-row-label"><span data-i18n="shortcutSidebar"></span></div>
        <div class="row sc-row">
          <button id="sb-btn" type="button" class="sc-btn"></button>
          <button id="sb-reset" type="button" class="dp-link" data-i18n="shortcutReset"></button>
        </div>
        <div id="sb-msg" class="msg" role="status"></div>
      </div>
    </section>

    <section class="card" id="sidebar-card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></span><div><h2 data-i18n="sidebarTitle"></h2><p class="muted" data-i18n="sidebarDesc"></p></div></div>
      <button id="sidebar-toggle" type="button" class="primary-btn"></button>
      <p class="muted sc-hint" id="sb-hint" data-i18n="sidebarHint"></p>
    </section>

    <section class="card set-rows">
      <label class="switch-row">
        <span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
        <span class="switch-text"><b data-i18n="badgeTitle"></b><span class="muted" data-i18n="badgeDesc"></span></span>
        <input type="checkbox" id="badge-toggle" class="switch">
      </label>
      <label class="switch-row">
        <span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span>
        <span class="switch-text"><b data-i18n="soundTitle"></b><span class="muted" data-i18n="soundDesc"></span></span>
        <input type="checkbox" id="sound-toggle" class="switch">
      </label>
    </section>

    <section class="card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 0 0 .42-8.98 6.5 6.5 0 0 0-12.7 1.61A4 4 0 0 0 6 19z"/></svg></span><div><h2 data-i18n="syncTitle"></h2><p class="muted" data-i18n="syncDesc"></p></div></div>
      <button id="sync-signin" class="google-btn" type="button" hidden><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span data-i18n="syncSignIn"></span></button>
      <div id="sync-on" class="sync-on" hidden>
        <div class="sync-acct"><span class="g-badge"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span><span id="sync-email"></span></div>
        <div class="sync-row">
          <button id="sync-now" type="button" class="primary-btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span data-i18n="syncNow"></span></button>
          <button id="sync-out" type="button" class="dp-link" data-i18n="syncSignOut"></button>
        </div>
        <p class="muted" id="sync-last"></p>
      </div>
      <p id="sync-setup" class="muted" hidden data-i18n="syncSetup"></p>
      <div id="sync-msg" class="msg" role="status"></div>
      <p class="muted" data-i18n="syncPrivacy"></p>
    </section>

    <section class="card">
      <div class="set-head"><span class="set-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg></span><div><h2 data-i18n="optData"></h2></div></div>
      <p class="muted" data-i18n="privacyNote"></p>
      <button id="wipe" class="danger" data-i18n="optDeleteAll"></button>
      <button id="restore-backup" class="dp-link" hidden></button>
      <div id="msg" class="msg" role="status"></div>
    </section>

    <div id="about" class="about"></div>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"><span id="toast-msg"></span><button id="toast-undo" type="button"></button></div>
<script src="i18n.js"></script>
<script src="util.js"></script>
<script src="datepicker.js"></script>
<script src="sync.js"></script>
<script src="popup.js"></script>
</body>
</html>
